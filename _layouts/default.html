<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.full_title %}{{ page.full_title }}{% elsif page.title %}{{ page.title }} - Haseeb Raja{% else %}Haseeb Raja{% endif %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            bg: 'var(--color-bg)',
                            card: 'var(--color-card)',
                            text: 'var(--color-text)',
                            secondary: 'var(--color-text-secondary)',
                            muted: 'var(--color-text-muted)',
                            faint: 'var(--color-text-faint)',
                            accent: 'var(--color-accent)',
                            'accent-hover': 'var(--color-accent-hover)',
                            border: 'var(--color-border)',
                            'border-light': 'var(--color-border-light)',
                            surface: 'var(--color-surface)',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
</head>

<body class="bg-theme-bg text-theme-text min-h-screen">
    {% include nav.html %}

    {{ content }}

    {% include footer.html license=page.license %}
</body>

</html>
