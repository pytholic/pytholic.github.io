---
layout: post
---
<main class="max-w-3xl mx-auto px-6 py-12">
    <a href="/notes.html" class="inline-flex items-center gap-2 text-theme-accent hover:underline mb-8">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        Back to Notes
    </a>

    <div class="mb-8">
        <div class="post-header-ruled">
            <h1 class="text-4xl font-bold mb-3">{{ page.title }}</h1>
            <p class="text-theme-muted">{{ page.date | date: "%B %-d, %Y" }}</p>
        </div>
        {% if page.tags %}
        <div class="flex flex-wrap gap-2">
            {% for tag in page.tags %}
            <span class="bg-theme-card px-3 py-1 rounded-full text-sm border border-theme-accent text-theme-accent">{{ tag }}</span>
            {% endfor %}
        </div>
        {% endif %}
    </div>

    <article class="prose prose-invert max-w-none text-theme-secondary">
        {{ content }}
    </article>
</main>
