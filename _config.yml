title: Haseeb Raja
description: AI Engineer based in South Korea
url: "https://pytholic.github.io"

collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: "posts"
    values:
      layout: post
      license: true
  - scope:
      path: "works"
    values:
      layout: default
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      license: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DEPLOYMENT.md
  - vendor
  - .claude
  - .playwright-cli
